<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menghubungkan ke Meta - Wargative Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #ffffff;
        color: #1e293b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 380px;
      }
      .meta-logo {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #1877f2;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        font-weight: 900;
        box-shadow: 0 8px 24px rgba(24, 119, 242, 0.25);
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3.5px solid #e2e8f0;
        border-top-color: #1877f2;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .title {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
      }
      .subtitle {
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
      }
      .success-icon {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: #dcfce7;
        color: #16a34a;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="loading-box">
      <div class="meta-logo" id="logoIcon">f</div>
      <div class="spinner" id="spinner"></div>
      <div class="success-icon" id="successIcon">✓</div>
      <h2 class="title" id="statusTitle">Menghubungkan ke Meta...</h2>
      <p class="subtitle" id="statusDesc">Membuka jendela otorisasi resmi Facebook. Mohon tunggu...</p>
    </div>

    <script>
      const META_APP_ID = '1074079788556384';

      // Parse Query & Hash Parameters
      const urlParams = new URLSearchParams(window.location.search);
      let channel = urlParams.get('channel') || urlParams.get('state');
      if (!channel && window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        channel = hashParams.get('state') || 'facebook';
      }
      if (!channel) channel = 'facebook';

      const logoIcon = document.getElementById('logoIcon');
      const spinner = document.getElementById('spinner');
      const successIcon = document.getElementById('successIcon');
      const statusTitle = document.getElementById('statusTitle');
      const statusDesc = document.getElementById('statusDesc');

      if (channel === 'instagram') {
        logoIcon.style.background = 'linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%)';
        logoIcon.textContent = '📸';
      } else if (channel === 'threads') {
        logoIcon.style.background = '#000000';
        logoIcon.textContent = '🧵';
      }

      // CASE 1: Returning from Meta OAuth (#access_token=...)
      if (window.location.hash && window.location.hash.includes('access_token=')) {
        try {
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          const accessToken = hashParams.get('access_token');
          if (accessToken) {
            statusTitle.textContent = 'Memverifikasi Akun...';
            statusDesc.textContent = 'Membaca Halaman Facebook dan profil yang Anda setujui...';

            fetch(`https://graph.facebook.com/v21.0/me?fields=id,name&access_token=${accessToken}`)
              .then((r) => r.json())
              .then((userData) => {
                const fbName = userData.name || 'Pengguna Facebook';
                const fbId = userData.id || '1074079788556384';
                let handle = fbName;

                // Fetch real pages and linked Instagram accounts
                fetch(`https://graph.facebook.com/v21.0/me/accounts?fields=id,name,access_token,instagram_business_account{id,username,name}&access_token=${accessToken}`)
                  .then((r) => r.json())
                  .then((accData) => {
                    let accountId = fbId;
                    let targetToken = accessToken;
                    const pagesList = accData.data || [];

                    if (pagesList.length > 0) {
                      const page = pagesList[0];
                      if (channel === 'instagram' && page.instagram_business_account) {
                        handle = '@' + page.instagram_business_account.username;
                        accountId = page.instagram_business_account.id;
                      } else {
                        handle = page.name;
                        accountId = page.id;
                        if (page.access_token) {
                          targetToken = page.access_token;
                        }
                      }
                    }

                    const availablePagesList = pagesList.map((p) => ({
                      id: p.id,
                      name: p.name,
                      accessToken: p.access_token || targetToken,
                      instagram: p.instagram_business_account ? {
                        id: p.instagram_business_account.id,
                        username: p.instagram_business_account.username,
                        name: p.instagram_business_account.name
                      } : null
                    }));

                    // Send back to parent window
                    if (window.opener && !window.opener.closed) {
                      window.opener.postMessage({
                        type: 'WARGATIVE_SOCIAL_AUTH_SUCCESS',
                        channelId: channel,
                        handle: handle,
                        token: targetToken,
                        accountId: accountId,
                        name: channel === 'instagram' ? 'Instagram Business' : 'Halaman Facebook',
                        availablePages: availablePagesList,
                        timestamp: Date.now()
                      }, '*');
                    }

                    // Success UI
                    spinner.style.display = 'none';
                    successIcon.style.display = 'flex';
                    statusTitle.textContent = 'Otorisasi Berhasil!';
                    statusDesc.textContent = `Akun ${handle} berhasil dihubungkan ke Wargative Studio. Menutup jendela...`;

                    setTimeout(() => window.close(), 1000);
                  })
                  .catch((err) => {
                    console.error('Accounts error:', err);
                    if (window.opener && !window.opener.closed) {
                      window.opener.postMessage({
                        type: 'WARGATIVE_SOCIAL_AUTH_SUCCESS',
                        channelId: channel,
                        handle: fbName,
                        token: accessToken,
                        accountId: fbId,
                        name: channel === 'instagram' ? 'Instagram Business' : 'Halaman Facebook',
                        availablePages: [],
                        timestamp: Date.now()
                      }, '*');
                    }
                    setTimeout(() => window.close(), 1000);
                  });
              })
              .catch((err) => {
                console.error('User fetch error:', err);
                setTimeout(() => window.close(), 1200);
              });
          }
        } catch (e) {
          console.error('Hash parse error:', e);
        }
      } else {
        // CASE 2: Initial click - Directly launch Meta's Real OAuth Dialog!
        const redirectUri = window.location.origin + '/oauth-popup.html';
        let scope = 'pages_show_list,pages_manage_posts,pages_read_engagement';
        if (channel === 'instagram') {
          scope = 'pages_show_list,pages_read_engagement,pages_manage_posts,instagram_basic,instagram_content_publish';
        }
        const authUrl = `https://www.facebook.com/v21.0/dialog/oauth?client_id=${META_APP_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=${encodeURIComponent(scope)}&state=${channel}`;
        
        // Instant redirect to Facebook!
        window.location.href = authUrl;
      }
    </script>
  </body>
</html>
