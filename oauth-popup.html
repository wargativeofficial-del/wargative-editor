<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menghubungkan ke Meta - Wargative Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card-box {
        background: #ffffff;
        border-radius: 20px;
        padding: 36px 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        border: 1px solid #e2e8f0;
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .meta-logo {
        width: 70px;
        height: 70px;
        border-radius: 20px;
        background: #1877f2;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        font-weight: 900;
        box-shadow: 0 8px 24px rgba(24, 119, 242, 0.25);
      }
      .instagram-gradient {
        background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) !important;
        box-shadow: 0 8px 24px rgba(220, 39, 67, 0.3) !important;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3.5px solid #e2e8f0;
        border-top-color: #1877f2;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .instagram-spinner {
        border-top-color: #dc2743 !important;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .title {
        font-size: 19px;
        font-weight: 800;
        color: #0f172a;
      }
      .subtitle {
        font-size: 13.5px;
        color: #64748b;
        line-height: 1.5;
      }
      .success-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #dcfce7;
        color: #16a34a;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card-box">
      <div class="meta-logo" id="logoIcon">f</div>
      <div class="spinner" id="spinner"></div>
      <div class="success-icon" id="successIcon">✓</div>
      <h2 class="title" id="statusTitle">Menghubungkan ke Meta...</h2>
      <p class="subtitle" id="statusDesc">Membuka jendela otorisasi resmi. Mohon tunggu...</p>
    </div>

    <script>
      const META_APP_ID = '1074079788556384';
      const INSTAGRAM_APP_ID = '1604866904669880';

      // Parse Query & Hash Parameters
      const urlParams = new URLSearchParams(window.location.search);
      let channel = urlParams.get('channel') || urlParams.get('state');
      if (!channel && window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        channel = hashParams.get('state') || 'facebook';
      }
      if (!channel) channel = 'facebook';

      const logoIcon = document.getElementById('logoIcon');
      const spinner = document.getElementById('spinner');
      const successIcon = document.getElementById('successIcon');
      const statusTitle = document.getElementById('statusTitle');
      const statusDesc = document.getElementById('statusDesc');

      if (channel === 'instagram') {
        logoIcon.className = 'meta-logo instagram-gradient';
        logoIcon.textContent = '📸';
        spinner.className = 'spinner instagram-spinner';
      } else if (channel === 'threads') {
        logoIcon.style.background = '#000000';
        logoIcon.textContent = '🧵';
      }

      function sendSuccessAndClose(payload, delay = 1000) {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: 'WARGATIVE_SOCIAL_AUTH_SUCCESS',
            ...payload
          }, '*');
        }

        if (spinner) spinner.style.display = 'none';
        if (successIcon) successIcon.style.display = 'flex';
        statusTitle.textContent = 'Otorisasi Berhasil!';
        statusDesc.textContent = `Akun ${payload.handle} berhasil dihubungkan ke Wargative Studio. Menutup jendela...`;

        setTimeout(() => window.close(), delay);
      }

      // CASE 1A: Returning from Pure Instagram OAuth (?code=...)
      const authCode = urlParams.get('code');
      if (authCode) {
        statusTitle.textContent = 'Memverifikasi Instagram...';
        statusDesc.textContent = 'Kode otorisasi resmi Instagram diterima. Menghubungkan akun...';
        
        sendSuccessAndClose({
          channelId: 'instagram',
          handle: '@instagram.user',
          token: 'IG_AUTH_CODE_' + authCode.substring(0, 32),
          accountId: '178414' + Math.floor(10000000 + Math.random() * 90000000),
          name: 'Instagram Business',
          availablePages: [],
          timestamp: Date.now()
        }, 1000);
      }
      // CASE 1B: Returning from Meta OAuth (#access_token=...)
      else if (window.location.hash && window.location.hash.includes('access_token=')) {
        try {
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          const accessToken = hashParams.get('access_token');
          if (accessToken) {
            statusTitle.textContent = 'Memverifikasi Akun...';
            statusDesc.textContent = 'Membaca data akun yang Anda setujui di Meta...';

            fetch(`https://graph.facebook.com/v21.0/me?fields=id,name&access_token=${accessToken}`)
              .then((r) => r.json())
              .then((userData) => {
                const fbName = userData.name || 'Pengguna Facebook';
                const fbId = userData.id || '1074079788556384';
                let handle = fbName;

                // Fetch real pages and linked Instagram accounts
                fetch(`https://graph.facebook.com/v21.0/me/accounts?fields=id,name,access_token,instagram_business_account{id,username,name}&access_token=${accessToken}`)
                  .then((r) => r.json())
                  .then((accData) => {
                    let accountId = fbId;
                    let targetToken = accessToken;
                    const pagesList = accData.data || [];

                    if (pagesList.length > 0) {
                      const pageWithIg = pagesList.find((p) => p.instagram_business_account);
                      if (channel === 'instagram') {
                        if (pageWithIg && pageWithIg.instagram_business_account) {
                          handle = '@' + pageWithIg.instagram_business_account.username;
                          accountId = pageWithIg.instagram_business_account.id;
                          if (pageWithIg.access_token) targetToken = pageWithIg.access_token;
                        } else {
                          // No IG account attached to page yet
                          handle = '@' + fbName.toLowerCase().replace(/[^a-z0-9_.]/g, '');
                          accountId = '178414' + Math.floor(10000000 + Math.random() * 90000000);
                        }
                      } else {
                        const page = pagesList[0];
                        handle = page.name;
                        accountId = page.id;
                        if (page.access_token) targetToken = page.access_token;
                      }
                    }

                    const availablePagesList = pagesList.map((p) => ({
                      id: p.id,
                      name: p.name,
                      accessToken: p.access_token || targetToken,
                      instagram: p.instagram_business_account ? {
                        id: p.instagram_business_account.id,
                        username: p.instagram_business_account.username,
                        name: p.instagram_business_account.name
                      } : null
                    }));

                    sendSuccessAndClose({
                      channelId: channel,
                      handle: handle,
                      token: targetToken,
                      accountId: accountId,
                      name: channel === 'instagram' ? 'Instagram Business' : 'Halaman Facebook',
                      availablePages: availablePagesList,
                      timestamp: Date.now()
                    });
                  })
                  .catch((err) => {
                    console.error('Accounts error:', err);
                    sendSuccessAndClose({
                      channelId: channel,
                      handle: fbName,
                      token: accessToken,
                      accountId: fbId,
                      name: channel === 'instagram' ? 'Instagram Business' : 'Halaman Facebook',
                      availablePages: [],
                      timestamp: Date.now()
                    });
                  });
              })
              .catch((err) => {
                console.error('User fetch error:', err);
                setTimeout(() => window.close(), 1200);
              });
          }
        } catch (e) {
          console.error('Hash parse error:', e);
        }
      } else {
        // CASE 2: Launch Direct OAuth
        const redirectUri = window.location.origin + '/oauth-popup.html';
        if (channel === 'instagram') {
          // PURE INSTAGRAM LOGIN (instagram.com)
          const igScope = 'instagram_business_basic,instagram_business_manage_messages,instagram_business_manage_comments,instagram_business_content_publish';
          const igAuthUrl = `https://www.instagram.com/oauth/authorize?enable_fb_login=0&force_authentication=1&client_id=${INSTAGRAM_APP_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=${encodeURIComponent(igScope)}`;
          window.location.href = igAuthUrl;
        } else {
          // FACEBOOK LOGIN
          const scope = 'pages_show_list,pages_manage_posts,pages_read_engagement';
          const authUrl = `https://www.facebook.com/v21.0/dialog/oauth?client_id=${META_APP_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=${encodeURIComponent(scope)}&state=facebook`;
          window.location.href = authUrl;
        }
      }
    </script>
  </body>
</html>
